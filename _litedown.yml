site:
  rebuild: outdated
  pattern: "[.]R?md$"

output:
  html:
    meta:
      # litedown >= 1.0: css/js accumulate on top of the site defaults
      # (@default, @article, @copy-button, @heading-anchor, @pages, @site);
      # "-@x" removes a default. css2/js2 are no longer read. style.css gets
      # priority 20 so it loads after litedown's libraries (10), e.g. lt/callout.
      css:
        0: ["-@site", "-@pages"]
        20: ["/assets/style.css"]
      js: ["@appendix"]
      include_before: "[Home](/index.html) [Hmmmm](/posts/index.html) [Tools](/tools.html) [About](/about.html)"
      include_after: "&copy; 2026 Cathal"
    options:
      toc: true
      embed_resources: false
